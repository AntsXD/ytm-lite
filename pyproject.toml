[project]
name = "ytm-lite"
version = "0.1.0"
description = "Lightweight native YouTube Music desktop client: Qt Widgets UI, libmpv audio, no embedded browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.12",
    "mpv>=1.0.8",
    "platformdirs>=4.3",
    "psutil>=7.0",
    # Used only by the worker process (src/ytm_worker).
    "ytmusicapi>=1.12.3",
    "yt-dlp>=2026.10.21",
    "yt-dlp-ejs>=0.8",
    "deno>=2.3",
    "certifi",
]

[project.gui-scripts]
ytm-lite = "ytm_lite.main:run"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-qt", "types-psutil"]
build = ["nuitka>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytm_lite", "src/ytm_worker"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Ambiguous-unicode rules would flag the em dashes and multiplication signs used in UI strings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["mpv", "yt_dlp", "yt_dlp.*", "yt_dlp_ejs", "yt_dlp_ejs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
